spring.application.name=exam-service

server.servlet.context-path=/exam-service
server.port=8081

# SQL Server - override with environment variables outside local development.
spring.datasource.url=${EXAM_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=english_practice;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${EXAM_DB_USERNAME:sa}
spring.datasource.password=${EXAM_DB_PASSWORD:123456A@$}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Tesseract
tesseract.datapath="/opt/homebrew/share/tessdata"
tesseract.language=eng
tesseract.page-seg-mode=6
tesseract.ocr-engine-mode=1

# Dung l??ng t?i ?a cho 1 file
spring.servlet.multipart.max-file-size=50MB

# Dung l??ng t?i ?a cho toàn b? request
spring.servlet.multipart.max-request-size=50MB
