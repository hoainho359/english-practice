spring.application.name=exam-service

server.servlet.context-path=/exam-service
server.port=8081

# SQL Server - override with environment variables outside local development.
spring.datasource.url=${EXAM_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=english_practice;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${EXAM_DB_USERNAME:sa}
spring.datasource.password=${EXAM_DB_PASSWORD:123456A@$}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT must match identity-service. Override this secret in every non-local environment.
jwt.signer-key=${JWT_SIGNER_KEY:"3dbe4e619417e361264c19257ef268509563901311a29babb7f4cef51f246473"}

# Tesseract OCR
tesseract.datapath=/opt/homebrew/share/tessdata
tesseract.language=eng
tesseract.page-seg-mode=6
tesseract.ocr-engine-mode=1

# PDF upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Spring AI - Gemini through Google's OpenAI-compatible endpoint.
# FIX: the old placeholder ${openai-api-key} was ambiguous and normally unresolved.
# Export GOOGLE_AI_API_KEY in the runtime environment; never commit the real key.
spring.ai.openai.api-key=${API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
# Spring AI defaults to /v1/chat/completions. Google already includes its API
# version in the base URL, so this override prevents a duplicated /v1 segment.
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=${GOOGLE_AI_MODEL:gemini-3.8-flash}
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=2048
