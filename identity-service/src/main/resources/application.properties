spring.application.name=identity-service
server.port=8080

server.servlet.context-path=/identity

# Database Configuration ============================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=english_practice;encrypt=true;trustServerCertificate=true
# Credentials hardcoded - consider using environment variables for production
spring.datasource.username=sa
spring.datasource.password=sapassword
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# JPA/Hibernate Configuration ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.default_schema=dbo

# Data Serialization Mode ============================================
spring.data.web.pageable.serialization-mode=via_dto

# Swagger/OpenAPI Configuration ============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


# Logging Configuration ============================================
logging.level.com.giaolang.mamnguqua=DEBUG
logging.level.org.springframework.security=INFO



#token dung cho ca prj de o day tranh lo https://generate-random.org/encryption-keys
jwt.signerKey = "3dbe4e619417e361264c19257ef268509563901311a29babb7f4cef51f246473"

#config cho outbound gg
outbound.identity.clientId=${GOOGLE_WEB_CLIENT_ID:}
outbound.identity.clientSecret=${GOOGLE_WEB_CLIENT_SECRET:}
