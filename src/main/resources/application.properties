spring.application.name=english-practice
server.port=8080

server.servlet.context-path=/english-practice

# Database Configuration ============================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=english_practice;encrypt=true;trustServerCertificate=true
# Credentials hardcoded - consider using environment variables for production
spring.datasource.username=sa
spring.datasource.password=123456A@$
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# JPA/Hibernate Configuration ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.default_schema=dbo

# Data Serialization Mode ============================================
spring.data.web.pageable.serialization-mode=via_dto


# CORS Configuration ============================================
# Cho phe'p requests t?*` frontend (thay the^' localhost:xxxx vo*'i domain thu*.c te^' khi deploy)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true


# Swagger/OpenAPI Configuration ============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


# Logging Configuration ============================================
logging.level.com.giaolang.mamnguqua=DEBUG
logging.level.org.springframework.security=INFO


